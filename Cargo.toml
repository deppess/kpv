[package]
name = "viewmer"
edition = "2021"
version = "0.1.0"

[dependencies]
base64 = "0.22.1"
mupdf = { default-features = false, version = "0.6" }
serde = { version = "1.0.219", features = ["derive"] }
toml = { features = ["parse", "display"], default-features = false, version = "0.8.22" }
crossterm = { version = "0.29", features = ["serde"] }
keybinds = { version = "0.2", features = ["crossterm", "serde"] }
unicode-width = "0.2"
alacritty_terminal = "0.26"
signal-hook = "0.3.18"
libc = "0.2"

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
