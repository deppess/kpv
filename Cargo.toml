[package]
name = "viewmer"
version = "1.0.0"
edition = "2021"
description = "A PDF viewer for the kitty terminal, with a notes terminal beside the pages"
license = "PolyForm-Strict-1.0.0"
repository = "https://codeberg.org/deppes/viewmer"
readme = "README.md"
publish = false

[dependencies]
base64 = "0.22.1"
mupdf = { default-features = false, version = "0.6" }
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde", "std"] }
crossterm = "0.29"
keybinds = { version = "0.2", features = ["crossterm", "serde"] }
unicode-width = "0.2"
alacritty_terminal = "0.26"
signal-hook = "0.3.18"
libc = "0.2"

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
# Line numbers for backtraces without the full debug info, which is most of target/
debug = "line-tables-only"

# Dependencies, MuPDF above all, are built without debug info and optimized: smaller and
# faster tests
[profile.dev.package."*"]
debug = false
opt-level = 2
